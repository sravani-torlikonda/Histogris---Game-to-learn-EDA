<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Histogris: a falling-block game that teaches Exploratory Data Analysis (histograms, mean vs median, outliers, missing values, bin width).">
<title>Histogris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2e9; --surface:#ffffff; --surface-2:#faf7f0; --board:#fffdf8; --grid:#f0e9db; --rule:#e1d8c6;
  --tile:#d4e5fb; --tile-2:#a8c7ee; --tile-ink:#1f3556; --miss:#6f7a92;
  --text:#2c3039; --muted:#7c808b;
  --accent:#4b7fd4; --accent-soft:#e8f0fc;
  --mean:#f08c3a; --mean-ink:#c4651b; --median:#15a092; --median-ink:#0d7d72;
  --danger:#e2574c; --gold:#f6c453; --gold-ink:#a87300; --good:#33a064;
  --f-display:'Fredoka','Nunito',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;max-width:1120px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding-inline:16px;padding-block:10px}

.topbar{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font:600 23px var(--f-display);color:var(--text);letter-spacing:.02em;white-space:nowrap}
.brand span{color:var(--mean)}
.lvl-label{flex:1;min-width:0;font:600 13px var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:6px}
.chip-btn{font:700 12px var(--f-body);background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip-btn:hover{border-color:var(--muted)}

#stage{display:grid;grid-template-columns:200px minmax(0,1fr) 200px;gap:16px;min-height:0}
.hud{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;min-width:0;box-shadow:0 2px 6px -4px rgba(80,60,20,.25)}
.label{font:700 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.score{font:600 30px/1.1 var(--f-display);color:var(--text);font-variant-numeric:tabular-nums}
.combo{font:700 12px var(--f-mono);color:var(--gold-ink);min-height:16px}
.lives{display:flex;gap:6px;margin-top:4px}
.heart{width:22px;height:20px;border-radius:4px;background:var(--danger);clip-path:polygon(50% 100%,0 38%,12% 6%,32% 0,50% 16%,68% 0,88% 6%,100% 38%)}
.heart.off{background:var(--rule)}
.prog{height:8px;border-radius:4px;background:var(--grid);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.prog-text{font:500 12px var(--f-mono);color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.objective{font-size:14px;margin-top:4px}
.meter{font:700 13px var(--f-mono);margin-top:4px}
.bins-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.bins-row b{font:700 18px var(--f-mono);min-width:2ch;text-align:center}

.next-box{display:flex;align-items:center;justify-content:center;height:54px;margin-top:6px;border:1px dashed var(--rule);border-radius:8px}
.tile{display:inline-block;font:700 15px var(--f-mono);color:var(--tile-ink);background:var(--tile);border-radius:6px;padding:7px 12px;box-shadow:inset 0 -3px 0 var(--tile-2);white-space:nowrap}
.tile.sm{font-size:12px;padding:4px 8px}
.tile.miss{background:transparent;color:var(--miss);border:2px dashed var(--miss);box-shadow:none}
.tile.mega{background:var(--gold);box-shadow:inset 0 -3px 0 #d9a12c}
.tile.fill{background:transparent;color:var(--median-ink);border:2px dashed var(--median);box-shadow:none}
.tile.flag{outline:2px solid var(--danger);outline-offset:2px}
.tile.is-med{outline:3px solid var(--median);outline-offset:2px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:6px 0 0;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.stats dt{color:var(--muted)}
.stats dd{margin:0;text-align:right;white-space:nowrap}
.stats .m{color:var(--mean-ink)} .stats .d{color:var(--median-ink)}
.legend{display:grid;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.legend div{display:flex;align-items:center;gap:8px}
.legend .tile{font-size:11px;padding:3px 7px}
.sw{display:inline-block;width:18px;height:0;border-top:3px solid var(--mean)}
.sw.d{border-top:3px dashed var(--median)}

.board-wrap{position:relative;min-height:0;min-width:0;display:grid;place-items:center}
#board{display:block;border-radius:10px;touch-action:none;cursor:pointer;box-shadow:0 0 0 1px var(--rule),0 14px 30px -18px rgba(80,60,20,.45)}
#toast{position:absolute;top:56px;left:50%;transform:translate(-50%,-6px);width:max-content;max-width:min(92%,380px);padding:9px 14px;border-radius:10px;background:var(--surface);border:1.5px solid var(--rule);font-size:14px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:3;box-shadow:0 8px 20px -12px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:var(--danger)} #toast.good{border-color:var(--good)} #toast.info{border-color:var(--gold)}
#banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,370px);max-height:calc(100% - 16px);overflow:auto;background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:18px;text-align:center;z-index:4;box-shadow:0 20px 50px -18px rgba(60,40,0,.45)}
#banner h3{font:600 21px/1.2 var(--f-display);color:var(--text);margin:0 0 10px;text-wrap:balance}
#banner p{margin:6px 0;font-size:15px}
#banner .big{font:700 16px var(--f-mono)}
#banner .small{color:var(--muted);font-size:14px}
.choices{display:grid;gap:6px;margin-top:12px}
.choice{text-align:left;padding:10px 12px;font-size:14px;background:var(--surface-2)}
.choice kbd{font:700 11px var(--f-mono);border:1px solid var(--rule);border-radius:4px;padding:0 5px;margin-right:6px;color:var(--muted)}
.choice small{color:var(--muted);font-weight:600}
.choice:hover{border-color:var(--accent)}
.tm{color:var(--mean-ink);font-weight:800} .td{color:var(--median-ink);font-weight:800}

.pad{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.key{min-width:56px;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--rule);background:var(--surface);font:700 15px var(--f-mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;user-select:none;touch-action:manipulation;box-shadow:0 2px 0 var(--rule)}
.key small{font:500 10px var(--f-mono);color:var(--muted)}
.key:active{transform:translateY(1px);box-shadow:none}
.key.trash{border-color:var(--danger);color:var(--danger)}
.key.drop{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 0 #3563ad}
.key.drop small{color:#e6eeff}
.key:disabled{opacity:.35;cursor:not-allowed}

#overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;grid-template-columns:minmax(0,660px);justify-content:center;overflow:auto;padding:16px;background:rgba(246,242,233,.92);backdrop-filter:blur(3px)}
.card{width:100%;min-width:0;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:26px;box-shadow:0 18px 40px -24px rgba(80,60,20,.45)}
.logo{font:600 clamp(42px,10vw,72px)/.95 var(--f-display);margin:0;color:var(--text);letter-spacing:.01em}
.logo span{color:var(--mean)}
.blocks-deco{display:flex;gap:6px;align-items:flex-end;height:46px;margin-bottom:14px}
.blocks-deco i{width:22px;background:var(--tile);border-radius:4px;box-shadow:inset 0 -3px 0 var(--tile-2);animation:rise 1.6s ease-in-out infinite alternate;transform-origin:bottom}
.blocks-deco i:nth-child(4){background:var(--gold);box-shadow:inset 0 -3px 0 #d9a12c}
.blocks-deco.sm{height:34px} .blocks-deco.sm i{width:16px}
@keyframes rise{from{transform:scaleY(.6)}to{transform:scaleY(1)}}
.tagline{font-size:17px;max-width:54ch;margin:14px 0 20px}
.eyebrow{font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.card h2{font:600 clamp(25px,5vw,34px)/1.1 var(--f-display);margin:8px 0 12px;color:var(--text);text-wrap:balance}
.card p{margin:0 0 12px;max-width:62ch}
.card .small{color:var(--muted);font-size:14px}
.card ul{margin:0 0 16px;padding-left:20px;display:grid;gap:8px}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lvl{text-align:left;border:1px solid var(--rule);background:var(--surface-2);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.lvl:hover:not(:disabled){border-color:var(--accent)}
.lvl .no{font:600 22px var(--f-display);color:var(--accent)}
.lvl .nm{font-weight:800;font-size:15px}
.lvl .cp{font-size:13px;color:var(--muted)}
.lvl .st{font:700 13px var(--f-mono);color:#e5a21a;letter-spacing:.08em}
.lvl .qz{font:600 12px var(--f-body);color:var(--muted)}
.lvl:disabled{opacity:.45;cursor:not-allowed}
.test-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.test-row b{display:block}
.test-row span{font-size:13px;color:var(--muted)}
.how{margin-top:16px;font-size:13px;color:var(--muted);display:grid;gap:4px}
.how kbd{font:600 12px var(--f-mono);color:var(--text);border:1px solid var(--rule);border-radius:4px;padding:0 5px;background:var(--surface)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{border-radius:12px;padding:11px 18px;border:1px solid var(--rule);background:var(--surface);cursor:pointer;font-weight:800;font-size:15px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.link{border:none;background:none;color:var(--muted);text-decoration:underline;padding:11px 6px}
.btn:hover{filter:brightness(1.04)}
.legend-row{display:flex;flex-wrap:wrap;gap:12px 16px;margin:4px 0 18px;font-size:13px;color:var(--muted)}
.legend-row div{display:flex;align-items:center;gap:8px}
.legend-row .tile{font-size:11px;padding:3px 7px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chips > span{font:600 13px var(--f-mono);border:1px solid var(--rule);border-radius:999px;padding:4px 10px;background:var(--surface-2)}
pre.code{background:#f3f6fb;border:1px solid #dbe3f0;border-radius:10px;padding:12px 14px;font:500 13px/1.6 var(--f-mono);color:#2d5ea8;overflow-x:auto;margin:0 0 16px;white-space:pre}
pre.code .c{color:var(--muted)}
.stars{font:700 22px var(--f-mono);color:#e5a21a;letter-spacing:.15em}

/* lessons */
.demo-tiles{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.demo-hist{display:flex;gap:14px;align-items:flex-end;margin:10px 0 14px;flex-wrap:wrap}
.dcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.dstack{display:flex;flex-direction:column-reverse;gap:4px;min-height:24px}
.dlab{font:600 12px var(--f-mono);color:var(--muted);border-top:2px solid var(--rule);padding-top:4px;min-width:64px;text-align:center}
.boxdemo{width:100%;height:auto;display:block;margin:4px 0 12px}
.survey{border-collapse:collapse;margin:4px 0 14px;font-size:14px}
.survey th,.survey td{border-bottom:1px solid var(--rule);padding:5px 14px;text-align:left}
.survey th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.survey .blank td{background:#fdf6e3}

.lesson-box{background:var(--surface-2);border:1px solid var(--rule);border-radius:12px;padding:12px 14px 2px;margin:0 0 14px}
.lesson-box p{font-size:14.5px}
details.py{margin:0 0 14px}
details.py summary{cursor:pointer;font:700 13px var(--f-body);color:var(--muted);margin-bottom:8px}
details.py pre.code{margin:0}
.goal{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:14px}
ol.goals{display:grid;gap:10px;padding-left:22px;margin:0 0 16px}
.res-wrap{overflow-x:auto;margin:0 0 14px}
table.res{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
table.res th,table.res td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
table.res th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table.res small{display:block;color:var(--muted);font-size:12px}
.res-in{display:block;width:100%;margin:6px 0 8px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;font:inherit;background:var(--surface)}
.res-out{display:block;width:100%;margin:0 0 10px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;font:500 12px/1.5 var(--f-mono);background:var(--surface-2);resize:vertical}
/* quiz */
.qbar{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:8px}
.qbar i{display:block;height:100%;background:var(--accent)}
.card h2.q{font-size:clamp(20px,4vw,26px);margin-top:14px}
.opts{display:grid;gap:8px;margin:10px 0 12px}
.opt{text-align:left;padding:12px 14px;border:1.5px solid var(--rule);border-radius:12px;background:var(--surface-2);cursor:pointer;font-weight:700;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:#e8f6ee}
.opt.wrong{border-color:var(--danger);background:#fdecea}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.why{background:var(--surface-2);border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.cmp{display:grid;gap:8px;margin:6px 0 16px}
.cmp-row{display:grid;grid-template-columns:60px 1fr 48px;align-items:center;gap:10px;font-size:14px}
.cmp-bar{height:14px;border-radius:7px;background:var(--grid);overflow:hidden}
.cmp-bar i{display:block;height:100%}
.cmp-bar i.b{background:var(--tile-2)} .cmp-bar i.a{background:var(--good)}

/* mini histograms in debriefs */
.mh-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:4px 0 10px}
.mh{border:1px solid var(--rule);border-radius:10px;padding:8px;background:var(--surface-2)}
.mh-bars{display:flex;align-items:flex-end;gap:2px;height:70px}
.mh-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.seg{display:block;background:var(--tile-2);border-radius:2px 2px 0 0}
.seg.f{background:var(--median)}
.mh-lab{font:700 12px var(--f-body);color:var(--muted);margin-top:6px}

@media (max-width:820px){
  #stage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);gap:8px}
  .hud{flex-direction:row;gap:8px}
  .hud.left{order:1} .hud.right{order:2} .board-wrap{order:3}
  .panel{padding:6px 10px;border-radius:10px}
  .score{font-size:20px}
  .p-score{flex:0 0 auto} .long{display:none}
  .prog-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-prog{min-width:0;flex:1} .p-lives{flex:0 0 auto}
  .p-obj,.p-legend{display:none}
  .p-loss,.p-bins{flex:0 0 auto}
  .lives{margin-top:2px} .heart{width:16px;height:15px}
  .label{font-size:10px;letter-spacing:.08em}
  .combo{display:none}
  .prog{margin-top:6px}
  .prog-text{margin-top:3px;font-size:11px}
  .p-next{flex:0 0 auto;display:flex;align-items:center;gap:8px}
  .next-box{height:34px;margin:0;border:none;padding:0 2px}
  .next-box .tile{font-size:13px;padding:4px 8px}
  .p-stats{flex:1}
  .stats{grid-template-columns:repeat(4,auto);gap:2px 8px;margin-top:2px;font-size:12px}
  .stats dd{text-align:left}
  .p-stats .label{display:none}
  .bins-row{margin-top:0}
  .bins-row .key{min-width:36px;height:30px;padding:0 8px}
  #toast{top:46px;font-size:13px}
  .key{min-width:52px;height:50px;padding:0 10px}
  .key small{display:none}
  .levels{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:20px}
  .brand{font-size:19px}
}
@media (max-width:420px){
  .lvl-label{display:none}
  .pad{gap:6px}
  .key{min-width:0;flex:1}
  .chip-btn{padding:5px 9px;font-size:11px}
  .test-row{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  .blocks-deco i{animation:none}
  #toast{transition:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">HISTO<span>GRIS</span></div>
    <div class="lvl-label" id="lvlLabel">Falling data puzzle</div>
    <div class="top-actions">
      <button class="chip-btn" id="btnPace" type="button">Relaxed pace</button>
      <button class="chip-btn" id="btnSound" type="button">Sound on</button>
      <button class="chip-btn" id="btnPause" type="button">Pause</button>
    </div>
  </header>

  <main id="stage">
    <aside class="hud left">
      <div class="panel p-score"><div class="label">Score</div><div class="score" id="score">0</div><div class="combo" id="combo"></div></div>
      <div class="panel p-lives"><div class="label">Hearts</div><div class="lives" id="lives"></div></div>
      <div class="panel p-prog"><div class="label">Progress</div><div class="prog"><i id="progFill"></i></div><div class="prog-text" id="progText">0 / 0</div></div>
      <div class="panel p-obj"><div class="label">Mission</div><div class="objective" id="objective">Pick a level to start.</div></div>
      <div class="panel p-loss" id="lossPanel" hidden><div class="label"><span class="long">Rows </span>dropped</div><div class="meter" id="lossText">0 / 2</div></div>
      <div class="panel p-bins" id="binsPanel" hidden><div class="label">Buckets</div>
        <div class="bins-row"><button class="key" type="button" data-act="binsDown" aria-label="Fewer buckets">−</button><b id="binsText">2</b><button class="key" type="button" data-act="binsUp" aria-label="More buckets">+</button></div>
      </div>
    </aside>

    <div class="board-wrap" id="wrap">
      <canvas id="board" aria-label="Game board: falling data blocks stacking into histogram columns"></canvas>
      <div id="toast" role="status"></div>
      <div id="banner" hidden></div>
    </div>

    <aside class="hud right">
      <div class="panel p-next"><div class="label">Next</div><div class="next-box" id="next"></div></div>
      <div class="panel p-stats"><div class="label">Your data</div>
        <dl class="stats">
          <dt>n</dt><dd id="stN">0</dd>
          <dt class="m lineStat">mean</dt><dd class="m lineStat" id="stMean">–</dd>
          <dt class="d lineStat">median</dt><dd class="d lineStat" id="stMedian">–</dd>
          <dt class="peakStat">peak</dt><dd class="peakStat" id="stPeak">–</dd>
        </dl>
      </div>
      <div class="panel p-legend"><div class="label">Board key</div>
        <div class="legend" id="legend"></div>
      </div>
    </aside>
  </main>

  <nav class="pad" aria-label="Controls">
    <button class="key" type="button" data-act="left" aria-label="Move left">◀<small>← A</small></button>
    <button class="key" type="button" data-act="soft" aria-label="Fall faster">▼<small>↓ S</small></button>
    <button class="key" type="button" data-act="right" aria-label="Move right">▶<small>→ D</small></button>
    <button class="key drop" type="button" data-act="drop" aria-label="Drop now">DROP<small>space</small></button>
    <button class="key trash" type="button" data-act="trash" id="btnTrash" aria-label="Trash block">TRASH<small>↑ W</small></button>
  </nav>
</div>

<div id="overlay"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ---------- math helpers ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r){ let u = 0, v = 0; while(!u) u = r(); while(!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(a, r){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function insertLate(a, item, r, minIdx){ const pos = minIdx + Math.floor(r() * (a.length - minIdx + 1)); a.splice(pos, 0, item); }
function quantile(sorted, q){ if(!sorted.length) return NaN; const p = (sorted.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p); return sorted[lo] + (sorted[hi] - sorted[lo]) * (p - lo); }
const inr = v => '₹' + Math.round(v).toLocaleString('en-IN');
const kfmt = v => v >= 1000 ? (v / 1000) + 'k' : String(v);
const hhmm = v => { let h = Math.floor(v + 1e-9), m = Math.round((v - h) * 60); if(m === 60){ h++; m = 0; } return h + ':' + String(m).padStart(2, '0'); };
const r1 = v => Math.round(v * 10) / 10;
function ninv(p){
  const a = [-39.6968302866538, 220.946098424521, -275.928510446969, 138.357751867269, -30.6647980661472, 2.50662827745924];
  const b = [-54.4760987982241, 161.585836858041, -155.698979859887, 66.8013118877197, -13.2806815528857];
  const c = [-0.00778489400243029, -0.322396458041136, -2.40075827716184, -2.54973253934373, 4.37466414146497, 2.93816398269878];
  const d = [0.00778469570904146, 0.32246712907004, 2.445134137143, 3.75440866190742];
  const lo = 0.02425; let q, r;
  if(p < lo){ q = Math.sqrt(-2 * Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p > 1 - lo){ q = Math.sqrt(-2 * Math.log(1 - p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q = p - 0.5; r = q * q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q / (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}

function boxDemo(step){

  }
  if(step >= 1){
    s += `<rect x="${X(q1)}" y="56" width="${X(q3) - X(q1)}" height="24" rx="3" fill="var(--tile)" stroke="var(--tile-ink)" stroke-width="1.5"/>`;
    s += `<line x1="${X(md)}" y1="56" x2="${X(md)}" y2="80" stroke="var(--median)" stroke-width="3"/>`;
    s += `<text x="${X(q3) + 8}" y="${step >= 2 ? 88 : 72}" font-size="12" font-weight="700" fill="var(--tile-ink)">IQR = 40</text>`;
  } else {
    [[q1, 'Q1', 'var(--tile-ink)'], [md, 'median', 'var(--median-ink)'], [q3, 'Q3', 'var(--tile-ink)']].forEach(([v, t, c]) => {

    });
  }
  V.forEach((v, i) => { s += `<circle cx="${X(v)}" cy="${i % 2 ? 28 : 40}" r="6" fill="${step >= 2 && v > hi ? 'var(--danger)' : 'var(--tile-2)'}" stroke="#fff" stroke-width="1.5"/>`; });
  s += `<line x1="30" y1="96" x2="530" y2="96" stroke="var(--rule)" stroke-width="2"/>`;
  for(let t = 150; t <= 400; t += 50) s += `<line x1="${X(t)}" y1="96" x2="${X(t)}" y2="101" stroke="var(--rule)"/><text x="${X(t)}" y="116" text-anchor="middle" font-size="11" fill="var(--muted)">${t}</text>`;
  return s + `</svg>`;
}
function miniHist(vals, fills, o){
  const { min, max, nb } = o, w = (max - min) / nb;
  const r = Array(nb).fill(0), f = Array(nb).fill(0), k = v => clamp(Math.floor((v - min) / w), 0, nb - 1);
  vals.forEach(v => r[k(v)]++); fills.forEach(v => f[k(v)]++);
  const mx = Math.max(1, ...r.map((x, i) => x + f[i]));
  return `<div class="mh"><div class="mh-bars">${r.map((x, i) => `<div class="mh-col">${f[i] ? `<span class="seg f" style="height:${f[i] / mx * 100}%"></span>` : ''}<span class="seg" style="height:${x / mx * 100}%"></span></div>`).join('')}</div><div class="mh-lab">${o.label}</div></div>`;
}

function genWave(r, wave, lastShape){
  const keys = Object.keys(SHAPES);
  let shape = wave === 1 ? 'normal' : keys[Math.floor(r() * keys.length)];
  if(shape === lastShape) shape = keys[(keys.indexOf(shape) + 1 + Math.floor(r() * 4)) % keys.length];
  const n = 16, a = [];
  for(let i = 0; i < n; i++){
    const p = (i + 0.2 + 0.6 * r()) / n;
    let v;
    switch(shape){
      case 'normal': v = 62 + 12 * ninv(p); break;
      case 'right': v = 26 - 18 * Math.log(1 - p); break;
      case 'left': v = 94 + 18 * Math.log(1 - p); break;
      case 'uniform': v = 3 + 94 * p; break;
      default: { const pp = ((i % (n / 2)) + 0.2 + 0.6 * r()) / (n / 2); v = (i < n / 2 ? 33 : 77) + 7 * ninv(pp); }
    }
    v = Math.round(clamp(v, 1, 99)); if(v % 10 === 0) v += v >= 99 ? -1 : 1;
    a.push({ v, kind: 'n' });
  }
  shuffle(a, r);
  const typos = [104, 112, 130, 150, -5, -12, 250];
  const nT = Math.min(2, wave), nM = wave >= 2 ? 1 : 0;
  for(let i = 0; i < nT; i++) insertLate(a, { v: typos[Math.floor(r() * typos.length)], kind: 'typo' }, r, 5);
  for(let i = 0; i < nM; i++) insertLate(a, { v: null, kind: 'miss' }, r, 5);
  return { items: a, shape };
}

const binW = () => (S.lv.bins.max - S.lv.bins.min) / S.nb;
function binOf(v){

  if(S.lv.open && v >= max - w) return S.nb - 1;

}
function binLabel(k){
  const lv = S.lv, w = binW(), lo = lv.bins.min + k * w;

function values(){ const a = []; S.cols.forEach(col => col.forEach(b => a.push(b.v))); return a; }
function stats(){

}
function isFlag(it){

function vx(v){ const { min, max } = S.lv.bins; return (v - min) / (max - min) * BW; }

/* ---------- geometry ---------- */
function geom(){

function startLevel(n){

function spawn(){

function landRow(c){ return ROWS - S.cols[c].length - 1; }
function update(dt){

function move(d){

function moveTo(c){ const f = S.falling; if(!f) return; const d = Math.sign(c - f.col); for(let i = 0; i < 40 && f.col !== c; i++){ const before = f.col; move(d); if(f.col === before) break; } }
function hardDrop(){

  const lr = landRow(f.col); S.score += Math.max(0, Math.round(lr - f.y)); f.y = Math.max(f.y, lr); land();

function award(pts, x, y){

function err(msg, x, y, type){

function pushBlock(c, b, fx){ b.c = c; b.i = S.cols[c].length; b.rc = fx; b.ri = b.i; S.cols[c].push(b); }
function land(){
  const f = S.falling; S.falling = null; S.spawnT = 0.28; S.soft = S.soft && keysDown.soft;
  const lv = S.lv, it = f.it, c = f.col, col = S.cols[c];
  const p = blockPx(f.x, Math.max(f.y, 0));
  if(it.kind === 'miss'){
    const mb = medianBin();
    if(c === mb){
      if(col.length >= ROWS) return overflow(c);
      const m = stats().n ? stats().median : quantile(S.planned, 0.5);
      pushBlock(c, { v: lv.n === 4 ? r1(m) : m, kind: 'fill' }, f.x);
      award(25, p.x, p.y); sfx.good(); toast(`Filled with the median: <b class="td">${lv.stat(m)}</b>`, 'good', 1800);
      afterPush(c);
    } else {

    }
    return;

  if(it.kind === 'typo'){
    err(`<b>${lv.say(it.v)}</b> is impossible. That’s a data error. Trash it with ▲.`, p.x, p.y, 'keptError');
    return;

  const b = binOf(it.v);

    if(col.length >= ROWS) return overflow(c);
    const before = stats();
    pushBlock(c, { v: it.v, kind: it.kind === 'mega' ? 'mega' : 'n' }, f.x);
    award(it.kind === 'rare' ? 30 : 10, p.x, p.y); sfx.land(c);
    if(it.kind === 'rare' || f.flag) toast(`Kept a real outlier: <b>${lv.say(it.v)}</b>. Unusual, not wrong.`, 'good', 2000);
    if(it.kind === 'mega') megaMoment(before);
    afterPush(c);

  const lv = S.lv, len = S.cols[c].length;

    S.warned[c + ':' + S.nb] = true;
    toast(lv.binOptions && S.nb < lv.binOptions[lv.binOptions.length - 1] ? 'A column is almost full. Try more buckets with <b>+</b> (E).' : 'A column is almost full!', 'info', 2600);

function trash(){
  const f = S.falling; if(!f || S.state !== 'play') return;

function runQuiz(qs, o){

}

  const totalT = rows.reduce((s, r) => s + (r.L ? r.L.time : 0), 0);
  showOverlay(`<div class="card"><div class="eyebrow">Playtest results</div><h2>My results</h2>
    <p><b>Warm-up test:</b> ${pre ?? '–'}/${TEST.length} &nbsp;·&nbsp; <b>Final test:</b> ${post ?? '–'}/${TEST.length} &nbsp;·&nbsp; <b>Play time:</b> ${fmtT(totalT)}</p>
    <div class="res-wrap"><table class="res"><tr><th>Level</th><th>Stars</th><th>Check</th><th>Tries</th><th>Mistakes</th><th>Time</th></tr>
    ${rows.map(r => `<tr><td>${r.l.n}. ${r.l.name}</td><td>${progress.stars[r.l.n] || 0}/3</td><td>${q(r.l.n)}</td><td>${r.L ? r.L.tries : 0}</td><td>${r.m}${r.top ? `<small>${r.top}</small>` : ''}</td><td>${r.L ? fmtT(r.L.time) : '–'}</td></tr>`).join('')}</table></div>
    <label class="label" for="resName">Your name (for the playtest sheet)</label>
    <input id="resName" class="res-in" type="text" placeholder="e.g. Priya" autocomplete="off">
    <textarea id="resText" class="res-out" rows="4" wrap="off" readonly></textarea>
    <div class="btns"><button class="btn primary" id="resCopy" type="button">Copy results</button><button class="btn" data-go="menu" type="button">All levels</button><button class="btn link" id="resNew" type="button">New player (reset)</button></div></div>`);
  const build = () => {
    const name = $('#resName').value.trim() || 'Player';
    const head = ['Name', 'Pre-test', 'Post-test', ...lvls.flatMap(l => [`L${l.n} stars`, `L${l.n} check`, `L${l.n} tries`, `L${l.n} mistakes`]), 'Play time', 'Endless best'];
    const vals = [name, pre ?? '', post ?? '', ...rows.flatMap(r => [progress.stars[r.l.n] || 0, q(r.l.n), r.L ? r.L.tries : 0, r.m]), fmtT(totalT), progress.best || 0];
    const notes = rows.filter(r => r.top).map(r => `L${r.l.n}: ${r.top}`).join(' | ');
    return head.join('\t') + '\n' + vals.join('\t') + (notes ? '\nMistakes: ' + notes : '');
  };
  const ta = $('#resText'); ta.value = build();
  $('#resName').oninput = () => { ta.value = build(); };
  $('#resCopy').onclick = () => {
    const done = () => { $('#resCopy').textContent = 'Copied!'; setTimeout(() => { const b = $('#resCopy'); if(b) b.textContent = 'Copy results'; }, 1500); };
    try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); document.execCommand('copy'); done(); }); }
    catch(e){ ta.select(); try { document.execCommand('copy'); done(); } catch(_){} }
  };
  let armed = false;
  $('#resNew').onclick = () => {
    if(!armed){ armed = true; $('#resNew').textContent = 'Click again to erase all progress'; return; }
    progress = fresh(); save(); S.preSkipped = false; menu();
  };
}
function pause(){
  if(S.state === 'play'){ S.state = 'paused'; S.soft = false;
    showOverlay(`<div class="card"><div class="eyebrow">Paused</div><h2>${S.lv.name}</h2><p>${S.lv.objective}</p>
      <div class="btns"><button class="btn primary" data-go="resume" type="button">Resume</button><button class="btn" data-go="play:${S.lv.n}" type="button">Restart level</button><button class="btn" data-go="menu" type="button">All levels</button></div></div>`);
  } else if(S.state === 'paused'){ hideOverlay(); S.state = 'play'; }
}
$('#overlay').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if(!b || b.disabled) return; audio();
  const [a, n] = b.dataset.go.split(':');
  switch(a){
    case 'brief': brief(+n); break;
    case 'briefx': brief(+n); break;
    case 'play': startLevel(+n); break;
    case 'menu': menu(); break;
    case 'resume': hideOverlay(); S.state = 'play'; break;
    case 'quiz': levelQuiz(+n); break;
    case 'pre': preTest(); break;
    case 'skippre': S.preSkipped = true; brief(1); break;
    case 'post': postTest(); break;
    case 'goals': goals(); break;
    case 'results': results(); break;
  }
});

/* ---------- input ---------- */
const keysDown = { soft: false };
addEventListener('keydown', e => {
  audio();
  if(S.state === 'banner'){
    if(choiceCb){ const d = parseInt(e.key, 10); const n = $('#banner').querySelectorAll('[data-c]').length; if(d >= 1 && d <= n){ e.preventDefault(); pick(d - 1); } return; }
    if(['Enter', 'Space', 'NumpadEnter'].includes(e.code)){ e.preventDefault(); closeBanner(); }
    return;
  }
  if(e.code === 'KeyP' || e.code === 'Escape'){ if(S.state === 'play' || S.state === 'paused'){ e.preventDefault(); pause(); } return; }
  if(S.state !== 'play') return;
  switch(e.code){
    case 'ArrowLeft': case 'KeyA': move(-1); break;
    case 'ArrowRight': case 'KeyD': move(1); break;
    case 'ArrowDown': case 'KeyS': S.soft = keysDown.soft = true; break;
    case 'Space': if(!e.repeat) hardDrop(); break;
    case 'ArrowUp': case 'KeyW': case 'KeyT': if(!e.repeat) trash(); break;
    case 'KeyQ': case 'BracketLeft': rebin(-1); break;
    case 'KeyE': case 'BracketRight': rebin(1); break;
    default: return;
  }
  e.preventDefault();
});
addEventListener('keyup', e => { if(e.code === 'ArrowDown' || e.code === 'KeyS'){ S.soft = keysDown.soft = false; } });
document.querySelectorAll('[data-act]').forEach(btn => {
  const act = btn.dataset.act;
  if(act === 'soft'){
    const on = e => { e.preventDefault(); audio(); S.soft = keysDown.soft = true; }, off = () => { S.soft = keysDown.soft = false; };
    btn.addEventListener('pointerdown', on); ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => btn.addEventListener(t, off));
    return;
  }
  btn.addEventListener('click', () => { audio();
    ({ left: () => move(-1), right: () => move(1), drop: hardDrop, trash, binsDown: () => rebin(-1), binsUp: () => rebin(1) })[act]();
  });
});
let ptr = null;
cv.addEventListener('pointerdown', e => { audio(); ptr = { x: e.offsetX, y: e.offsetY }; });
cv.addEventListener('pointerup', e => {
  if(!ptr || S.state !== 'play') { ptr = null; return; }
  const dx = e.offsetX - ptr.x, dy = e.offsetY - ptr.y; ptr = null;
  if(Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx)){ dy > 0 ? hardDrop() : trash(); return; }
  if(Math.abs(dx) > 50){ move(Math.sign(dx)); return; }
  const f = S.falling; if(!f) return;
  const c = clamp(Math.floor(e.offsetX / geom().colW), 0, S.nb - 1);
  if(c === f.col) hardDrop(); else moveTo(c);
});
$('#btnPause').addEventListener('click', () => { audio(); if(S.state === 'play' || S.state === 'paused') pause(); });
$('#btnSound').addEventListener('click', () => { muted = !muted; store.set('muted', muted); setChipLabels(); audio(); sfx.good(); });
$('#btnPace').addEventListener('click', () => { relaxed = !relaxed; store.set('relaxed', relaxed); setChipLabels(); toast(relaxed ? 'Relaxed pace: blocks fall slower.' : 'Normal pace.', 'info', 1400); });
document.addEventListener('visibilitychange', () => { if(document.hidden && S.state === 'play') pause(); });

/* ---------- drawing ---------- */
function rrect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function fitText(txt, maxW, size, weight = 700){
  ctx.font = `${weight} ${size}px ${MONO}`; const w = ctx.measureText(txt).width;
  if(w > maxW){ size = Math.max(7, size * maxW / w); ctx.font = `${weight} ${size}px ${MONO}`; }
  return size;
}
function drawBlock(x, y, w, h, kind, v, flag, t){
  const r = Math.min(6, h * 0.22), lv = S.lv;
  let txt = kind === 'miss' ? '?' : lv.fmt(v), ink = C['tile-ink'];
  ctx.save();
  if(flag){ ctx.shadowColor = C.danger; ctx.shadowBlur = 10 + 6 * Math.sin(t * 8); }
  if(kind === 'miss'){
    rrect(x, y, w, h, r); ctx.fillStyle = alpha(C.miss, 0.08); ctx.fill();
    ctx.setLineDash([4, 3]); ctx.strokeStyle = C.miss; ctx.lineWidth = 1.6; ctx.stroke(); ctx.setLineDash([]); ink = C.miss;
  } else if(kind === 'fill'){
    rrect(x, y, w, h, r); ctx.fillStyle = alpha(C.median, 0.16); ctx.fill();
    ctx.setLineDash([3, 3]); ctx.strokeStyle = C.median; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]); ink = C.median;
  } else {
    rrect(x, y, w, h, r); ctx.fillStyle = kind === 'mega' ? C.gold : C.tile; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.save(); ctx.clip(); ctx.fillStyle = alpha(kind === 'mega' ? '#b07800' : C['tile-2'], 0.6); ctx.fillRect(x, y + h - Math.max(2, h * 0.13), w, h); ctx.restore();
    if(flag){ rrect(x, y, w, h, r); ctx.strokeStyle = C.danger; ctx.lineWidth = 2; ctx.stroke(); }
  }
  ctx.shadowBlur = 0;
  const fs = fitText(txt, w - 6, Math.min(h * 0.5, 15));
  ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, x + w / 2, y + h / 2 - (kind === 'n' || kind === 'mega' ? h * 0.04 : 0) + 0.5);
  ctx.restore();
  return fs;
}
function tag(x, y, text, bg, ink, align){
  ctx.font = `700 10px ${MONO}`; const w = ctx.measureText(text).width + 10, h = 15;
  let tx = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  tx = clamp(tx, 1, BW - w - 1);
  rrect(tx, y, w, h, 4); ctx.fillStyle = bg; ctx.fill();
  ctx.fillStyle = ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(text, tx + 5, y + h / 2 + 0.5);
}
let T = 0;
function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, BW, BH);
  ctx.save();
  if(S.shake > 0.3) ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
  ctx.fillStyle = C.board; ctx.fillRect(-20, -20, BW + 40, BH + 40);
  const g = geom(), lv = S.lv;
  ctx.lineWidth = 1; ctx.strokeStyle = C.grid; ctx.beginPath();
  for(let r = 0; r <= ROWS; r++){ const y = Math.round(g.top + r * g.cellH) + 0.5; ctx.moveTo(0, y); ctx.lineTo(BW, y); }
  ctx.stroke();
  ctx.strokeStyle = C.rule; ctx.beginPath();
  for(let c = 1; c < S.nb; c++){ const x = Math.round(c * g.colW) + 0.5; ctx.moveTo(x, g.top); ctx.lineTo(x, g.bottom); }
  ctx.stroke();
  if(!lv){ ctx.restore(); return; }
  const f = S.falling;
  // outlier zones
  let fz = null;
  if(lv.box){
    fz = fences();
    if(fz){
      const xl = clamp(vx(fz.lo), 0, BW), xh = clamp(vx(fz.hi), 0, BW);
      ctx.fillStyle = alpha(C.danger, 0.07);
      ctx.fillRect(0, g.top, xl, g.bottom - g.top); ctx.fillRect(xh, g.top, BW - xh, g.bottom - g.top);
      ctx.save(); ctx.beginPath(); ctx.rect(0, g.top, xl, g.bottom - g.top); ctx.rect(xh, g.top, BW - xh, g.bottom - g.top); ctx.clip();
      ctx.strokeStyle = alpha(C.danger, 0.14); ctx.lineWidth = 1; ctx.beginPath();
      for(let d = -BH; d < BW + BH; d += 10){ ctx.moveTo(d, g.bottom); ctx.lineTo(d + (g.bottom - g.top), g.top); }
      ctx.stroke(); ctx.restore();
      ctx.setLineDash([4, 4]); ctx.strokeStyle = alpha(C.danger, 0.7); ctx.beginPath();
      if(xl > 1){ ctx.moveTo(xl + 0.5, g.top); ctx.lineTo(xl + 0.5, g.bottom); }
      if(xh < BW - 1){ ctx.moveTo(xh - 0.5, g.top); ctx.lineTo(xh - 0.5, g.bottom); }
      ctx.stroke(); ctx.setLineDash([]);
    }
  }
  S.cols.forEach((col, c) => {
    if(col.length >= ROWS - 3){ ctx.fillStyle = alpha(C.danger, 0.1 + 0.05 * Math.sin(T * 6)); ctx.fillRect(c * g.colW, g.top, g.colW, g.bottom - g.top); }
  });
  // beginner guide: first blocks of level 1
  if(f && lv.n === 1 && S.idx <= 3 && f.it.kind === 'n'){
    const gb = binOf(f.it.v);
    if(gb >= 0){ ctx.fillStyle = alpha(C.good, 0.13 + 0.05 * Math.sin(T * 5)); ctx.fillRect(gb * g.colW, g.top, g.colW, g.bottom - g.top);
      ctx.fillStyle = C.good; ctx.font = `700 10px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('HERE', (gb + 0.5) * g.colW, g.bottom - 3); }
  }
  if(f && f.it.kind === 'miss'){
    const mb = medianBin();
    if(mb >= 0){ ctx.fillStyle = alpha(C.median, 0.13 + 0.05 * Math.sin(T * 5)); ctx.fillRect(mb * g.colW, g.top, g.colW, g.bottom - g.top);
      ctx.fillStyle = C.median; ctx.font = `700 9px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('MEDIAN', (mb + 0.5) * g.colW, g.bottom - 3); }
  }
  if(f){
    ctx.fillStyle = alpha(C.text, 0.04); ctx.fillRect(f.col * g.colW, g.top, g.colW, g.bottom - g.top);
    const lr = landRow(f.col);
    if(lr >= 0){ rrect(f.col * g.colW + 2.5, g.top + lr * g.cellH + 2, g.colW - 5, g.cellH - 4, 5); ctx.setLineDash([3, 3]); ctx.strokeStyle = alpha(C['tile-ink'], 0.3); ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]); }
  }
  // overflow line
  ctx.strokeStyle = alpha(C.danger, 0.6); ctx.setLineDash([6, 5]); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, g.top + 0.5); ctx.lineTo(BW, g.top + 0.5); ctx.stroke(); ctx.setLineDash([]);
  // stacked blocks
  S.cols.forEach((col, c) => {
    col.forEach(b => drawBlock(b.rc * g.colW + 2, g.bottom - (b.ri + 1) * g.cellH + 1.5, g.colW - 4, g.cellH - 3, b.kind, b.v, false, T));
    if(col.length){ const top = col[col.length - 1]; ctx.fillStyle = C.muted; ctx.font = `700 10px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(col.length, (top.rc + 0.5) * g.colW, g.bottom - (top.ri + 1) * g.cellH - 1); }
  });
  // mean / median lines
  if(lv.lines){
    const st = stats();
    if(st.n){
      const draws = [[st.median, C.median, 'MEDIAN', [6, 4], 21], [st.mean, C.mean, 'MEAN', [], 4]];
      draws.forEach(([v, col, name, dash, ty]) => {
        const raw = vx(v), off = raw > BW - 2 || raw < 2, x = clamp(raw, 2, BW - 2);
        ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(x, g.top); ctx.lineTo(x, g.bottom); ctx.stroke(); ctx.setLineDash([]);
        const txt = `${name} ${lv.stat(v)}${off ? (raw > BW ? ' →' : ' ←') : ''}`;
        tag(x, ty, txt, col, '#ffffff', off ? (raw > BW ? 'right' : 'left') : 'center');
      });
    }
  }
  // falling block
  if(f){
    f.x += (f.col - f.x) * Math.min(1, 0.35);
    const x = f.x * g.colW + 2, y = g.top + f.y * g.cellH + 1.5, flag = f.flag && lv.box;
    drawBlock(x, y, g.colW - 4, g.cellH - 3, f.it.kind, f.it.v, flag, T);
    if(flag){ ctx.font = `700 9px ${MONO}`; const tw = ctx.measureText('OUTLIER?').width; ctx.fillStyle = C.danger; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('OUTLIER?', clamp(x + (g.colW - 4) / 2, tw / 2 + 2, BW - tw / 2 - 2), y - 2); }
  }
  // axis
  ctx.strokeStyle = C.rule; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, g.bottom + 0.5); ctx.lineTo(BW, g.bottom + 0.5); ctx.stroke();
  const tickF = lv.tickS || lv.tick, w = binW();
  ctx.font = `500 10px ${MONO}`; ctx.fillStyle = C.muted; ctx.textBaseline = 'top';
  const every = Math.max(1, Math.ceil(30 / g.colW));
  const lastEdge = lv.open ? S.nb - 1 : S.nb;
  for(let k = 0; k <= lastEdge; k++){
    const x = k * g.colW;
    ctx.strokeStyle = C.rule; ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, g.bottom); ctx.lineTo(Math.round(x) + 0.5, g.bottom + 4); ctx.stroke();
    if(k % every) continue;
    ctx.textAlign = k === 0 ? 'left' : k === S.nb ? 'right' : 'center';
    ctx.fillText(tickF(+(lv.bins.min + k * w).toFixed(4)), x, g.bottom + 6);
  }
  if(lv.open){ ctx.textAlign = 'center'; ctx.fillText(tickF(lv.bins.max - w) + '+', (S.nb - 0.5) * g.colW, g.bottom + 6); }
  ctx.textAlign = 'center'; ctx.fillStyle = C.muted; ctx.font = `500 10px ${MONO}`; ctx.fillText(lv.axis, BW / 2, g.bottom + 18);
  // box plot strip
  if(lv.box && fz && fz.live){
    const y0 = g.bottom + LABEL_H + 2, yc = y0 + 11;
    const X = v => clamp(vx(v), 1, BW - 1);
    ctx.strokeStyle = C['tile-ink']; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(X(fz.wlo), yc); ctx.lineTo(X(fz.q1), yc); ctx.moveTo(X(fz.q3), yc); ctx.lineTo(X(fz.whi), yc);
    ctx.moveTo(X(fz.wlo), yc - 5); ctx.lineTo(X(fz.wlo), yc + 5); ctx.moveTo(X(fz.whi), yc - 5); ctx.lineTo(X(fz.whi), yc + 5); ctx.stroke();
    ctx.fillStyle = C.tile; ctx.fillRect(X(fz.q1), yc - 7, X(fz.q3) - X(fz.q1), 14); ctx.strokeRect(X(fz.q1), yc - 7, X(fz.q3) - X(fz.q1), 14);
    ctx.strokeStyle = C.median; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(fz.med), yc - 7); ctx.lineTo(X(fz.med), yc + 7); ctx.stroke();
    ctx.fillStyle = C.danger; fz.sorted.forEach(v => { if(v < fz.lo || v > fz.hi){ ctx.beginPath(); ctx.arc(X(v), yc, 3, 0, Math.PI * 2); ctx.fill(); } });
    ctx.fillStyle = C.muted; ctx.font = `600 9px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('BOX PLOT', 3, y0 + 23);
  } else if(lv.box){
    ctx.fillStyle = C.muted; ctx.font = `600 9px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('BOX PLOT builds after 8 blocks', 3, g.bottom + LABEL_H + 13);
  }
  // flyers & particles
  flyers.forEach(fl => { ctx.save(); ctx.globalAlpha = Math.max(0, fl.life / 0.9); ctx.translate(fl.x, fl.y); ctx.rotate(fl.rot); drawBlock(-fl.w / 2, -fl.h / 2, fl.w, fl.h, fl.it.kind, fl.it.v, false, T); ctx.restore(); });
  parts.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    if(p.text){ ctx.fillStyle = p.color; ctx.font = `700 13px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.text, p.x, p.y); }
    else { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); }
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}
function animate(dt){
  T += dt;
  S.shake *= Math.pow(0.02, dt);
  S.cols.forEach((col, c) => col.forEach(b => { b.rc += (c - b.rc) * Math.min(1, dt * 14); b.ri += (b.i - b.ri) * Math.min(1, dt * 14); }));
  parts.forEach(p => { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if(!p.text) p.vy += 500 * dt; });
  parts = parts.filter(p => p.life > 0);
  flyers.forEach(f => { f.life -= dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 900 * dt; f.rot += f.vr * dt; });
  flyers = flyers.filter(f => f.life > 0);
}
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if(S.state === 'play') update(dt);
  animate(dt); draw();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
function start(){
  setChipLabels();
  new ResizeObserver(resize).observe($('#wrap'));
  resize(); updateHUD(); menu();
  requestAnimationFrame(frame);
}
try { window.claude?.hot?.snapshot?.(() => ({ progress })); } catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
